[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quicfp"
version = "1.0.0"
description = "QUIC/HTTP3 traffic fingerprinter -- detection tooling for the growing QUIC blind spot"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ashwin N" }
]
keywords = [
    "quic", "http3", "network-security", "fingerprinting", "traffic-analysis",
    "tls", "nids", "packet-analysis", "cybersecurity", "ja3", "ja4"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    "cryptography>=41.0",
    "dpkt>=1.9",
    "scapy>=2.5",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
quicfp = "quicfp.cli:main"

[project.urls]
Homepage = "https://github.com/AshwinNHacker/quic-fingerprinter"
Repository = "https://github.com/AshwinNHacker/quic-fingerprinter"
Issues = "https://github.com/AshwinNHacker/quic-fingerprinter/issues"

[tool.setuptools.packages.find]
include = ["quicfp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
